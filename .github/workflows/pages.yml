name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test question bank and quiz logic
        run: npm test
      - name: Build static website
        run: npm run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed Pages site
        shell: bash
        run: |
          site="https://yunnre060214-sudo.github.io/Apple-Trivia/"
          for attempt in 1 2 3 4 5; do
            http_code="$(curl --silent --show-error --location --output /tmp/apple-trivia-index.html --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "$site" || true)"
            asset_code="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "${site}assets/app.mjs" || true)"
            version_code="$(curl --silent --show-error --location --output /tmp/apple-trivia-version.json --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "${site}version.json" || true)"
            if [ "$http_code" = "200" ] && [ "$asset_code" = "200" ] && [ "$version_code" = "200" ] \
               && grep -q '<title>Apple Trivia' /tmp/apple-trivia-index.html \
               && grep -q '"version"' /tmp/apple-trivia-version.json; then
              echo "Verified live site, JavaScript and version.json: $site"
              cat /tmp/apple-trivia-version.json
              exit 0
            fi
            echo "Attempt $attempt: index=$http_code app.mjs=$asset_code version.json=$version_code"
            sleep 3
          done
          echo "GitHub Pages public smoke test failed for $site" >&2
          exit 1
